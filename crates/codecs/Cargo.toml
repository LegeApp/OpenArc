[package]
name = "codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JPEG XL, HEIC and RAW codec implementations for OpenArc"

[features]
default = []

[dependencies]
# The JPEG XL codec: OpenArc's image encoder for every image output.
# `jpxl-encode` is the normative writer, `jpxl-encode-policy` the lossy VarDCT
# search half, `jpxl-decode` the reader used on extraction.
jpxl-core = { path = "../../../jpegXL-rs/JPXL/crates/jpxl-core" }
jpxl-encode = { path = "../../../jpegXL-rs/JPXL/crates/jpxl-encode" }
jpxl-encode-policy = { path = "../../../jpegXL-rs/JPXL/crates/jpxl-encode-policy" }
jpxl-decode = { path = "../../../jpegXL-rs/JPXL/crates/jpxl-decode" }
# Retained for its HEIF/ISOBMFF parser (`bpg_decode::heic`), which is how HEIC
# sources are read, and for decoding `.bpg` entries in archives written before
# the JPEG XL switch. The BPG *encoders* are gone.
bpg-decode = { path = "../../../bpg-rs/crates/bpg-decode" }
# JPEG 2000 is retained for *reading* .jp2/.j2k sources. It is no longer an
# encode fallback: every image output is JPEG XL.
jp2lam = { git = "https://github.com/LegeApp/jp2lam" }
anyhow.workspace = true
thiserror.workspace = true
lcms2.workspace = true
serde.workspace = true
infer.workspace = true
tempfile.workspace = true
image.workspace = true
which = "8.0"

[lib]
name = "codecs"
path = "mod.rs"
