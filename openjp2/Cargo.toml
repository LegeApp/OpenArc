[package]
name = "openjp2"
version = "0.5.3"
authors = ["Robert G. Jakabosky <rjakabosky+neoawareness.com>"]
license = "BSD-2-Clause"
description = "Rust port of OpenJPEG."
repository = "https://github.com/Neopallium/openjp2"
homepage = "https://github.com/Neopallium/openjp2/tree/master/openjp2-rs"
documentation = "https://docs.rs/openjp2"
keywords = ["j2k", "jp2", "jpeg2000", "image"]
edition = "2021"
autobins = false

exclude = ["CMakeLists.txt", "samples/*"]

[lib]
name = "openjp2"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bitflags = "1.3.2"
byteorder = "1.5"
libc = "0.2"
log = "0.4.17"
sprintf = "0.1.3"
smallvec = "1.13"

# Only used by the optional `png2jp2` / `openjp2_tester` binaries (see `extra-bins`).
clap = { version = "4.4", optional = true, features = ["derive"] }
image = { version = "0.25", default-features = false, optional = true }

[features]
default = ["std", "file-io"]
std = ["log/std"]
file-io = []
jpwl = []
jpspec = []

# Builds the auxiliary encoder/tester tools; not needed for decode-only / OpenArc.
extra-bins = ["dep:clap", "dep:image", "image?/png"]

[[bin]]
name = "png2jp2"
path = "src/main.rs"
required-features = ["extra-bins"]

[[bin]]
name = "openjp2_tester"
path = "src/tester_main.rs"
required-features = ["extra-bins"]
