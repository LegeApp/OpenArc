[package]
name = "bpg-viewer"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
image = { workspace = true, default-features = false, features = ["png", "tiff", "bmp", "webp", "jpeg"] }
zune-image.workspace = true
png = "0.17"
lcms2 = "6.0"
rawloader = "0.37"
codecs = { path = "../codecs" }
dng = { path = "../dng-rs" }
openjp2 = { path = "../openjp2" }
parking_lot.workspace = true
libc = "0.2"
libloading = "0.8"
fast_image_resize = "6.0"
toojpeg = { path = "../test-folder-for-jpeg-resizing/TooJpeg-rust" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.5"

# Binaries disabled - only library is needed for OpenArc integration
# [[bin]]
# name = "bpg-view"
# path = "src/bin/viewer.rs"
#
# [[bin]]
# name = "bpg-thumb"
# path = "src/bin/thumbnail.rs"
