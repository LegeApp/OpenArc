[workspace]
members = [
    "arcmax",
    "codecs",
    "openarc-ffi",
    "bpg-viewer",
    "zune-image",
    "bpg-viewer/gpu-thumbnail-src",
    "gpu-thumbnail-dll",
    "windows-rs-71/crates/libs/windows",
    "windows-rs-71/crates/libs/core",
    "windows-rs-71/crates/libs/targets",
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_raw_dylib, windows_slim_errors)'] }
missing_unsafe_on_extern = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["OpenArc Contributors"]

[workspace.dependencies]
# Shared dependencies across workspace
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
walkdir = "2.5"
indicatif = "0.18"
crc32fast = "1.5"
infer = "0.19"
tempfile = "3.24"
libloading = "0.9"
flume = "0.12"

# Image processing
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp"] }
zune-image = { path = "zune-image" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.38", features = ["bundled"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Compression
zstd = "0.13"
tar = "0.4"

# System
parking_lot = "0.12"
sysinfo = "0.30"
bytemuck = { version = "1.23", features = ["extern_crate_alloc"] }
log = "0.4"

# Proc-macro dependencies (required by windows-rs)
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false }

# Windows-rs dependencies (from windows-rs-71) - ALL workspace dependencies to avoid inheritance errors
cppwinrt = { version = "0.3.4", path = "windows-rs-71/crates/libs/cppwinrt", default-features = false }
windows = { version = "0.62.2", path = "windows-rs-71/crates/libs/windows", default-features = false }
windows-bindgen = { version = "0.65.0", path = "windows-rs-71/crates/libs/bindgen", default-features = false }
windows-collections = { version = "0.3.2", path = "windows-rs-71/crates/libs/collections", default-features = false }
windows-core = { version = "0.62.2", path = "windows-rs-71/crates/libs/core", default-features = false }
windows-future = { version = "0.3.2", path = "windows-rs-71/crates/libs/future", default-features = false }
windows-implement = { version = "0.60.2", path = "windows-rs-71/crates/libs/implement", default-features = false }
windows-interface = { version = "0.59.3", path = "windows-rs-71/crates/libs/interface", default-features = false }
windows-link = { version = "0.2.1", path = "windows-rs-71/crates/libs/link", default-features = false }
windows-metadata = { version = "0.59.0", path = "windows-rs-71/crates/libs/metadata", default-features = false }
windows-numerics = { version = "0.3.1", path = "windows-rs-71/crates/libs/numerics", default-features = false }
windows-registry = { version = "0.6.1", path = "windows-rs-71/crates/libs/registry", default-features = false }
windows-result = { version = "0.4.1", path = "windows-rs-71/crates/libs/result", default-features = false }
windows-services = { version = "0.26.1", path = "windows-rs-71/crates/libs/services", default-features = false }
windows-strings = { version = "0.5.1", path = "windows-rs-71/crates/libs/strings", default-features = false }
windows-sys = { version = "0.61.2", path = "windows-rs-71/crates/libs/sys", default-features = false }
windows-targets = { version = "0.53.5", path = "windows-rs-71/crates/libs/targets", default-features = false }
windows-threading = { version = "0.2.1", path = "windows-rs-71/crates/libs/threading", default-features = false }
windows-version = { version = "0.1.7", path = "windows-rs-71/crates/libs/version", default-features = false }

[package]
name = "openarc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenArc media archiver - library and CLI"

[features]
default = ["heif"]
heif = ["codecs/heif"]

[dependencies]
# CLI dependencies
anyhow.workspace = true
clap.workspace = true
flume.workspace = true
indicatif.workspace = true

# Core functionality
thiserror.workspace = true
rayon.workspace = true
walkdir.workspace = true
tempfile.workspace = true
crc32fast.workspace = true

# Hashing + integrity
sha2.workspace = true
hex.workspace = true

# Catalog
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

# Workspace crates
arcmax = { path = "arcmax", features = ["tar"] }
codecs = { path = "codecs" }

# System
parking_lot.workspace = true
sysinfo.workspace = true
bytemuck.workspace = true
log.workspace = true

# Compression
zstd.workspace = true
tar.workspace = true

# Image processing
image.workspace = true
zune-image.workspace = true

[lib]
name = "openarc"
path = "src/lib.rs"

[[bin]]
name = "openarc"
path = "src/main.rs"

[build-dependencies]
# No external dependencies needed - build.rs uses only std
