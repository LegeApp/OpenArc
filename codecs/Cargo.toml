[package]
name = "codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BPG, HEIC, and FFmpeg codec implementations for OpenArc"

[features]
default = []
heif = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
libloading.workspace = true
infer.workspace = true
tempfile.workspace = true
image.workspace = true
which = "8.0"
# Pure Rust HEIC decoder - no FFI dependencies
heic-decoder = { path = "../heic-decoder-rs" }

[build-dependencies]
cc = "1.2"

[lib]
name = "codecs"
path = "mod.rs"
